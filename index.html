<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5a248d">
  <title>Miloni Highlights ♡</title>
  <meta name="description" content="A growing collection of messages for Miloni.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="site">
    <header class="hero">
      <div class="corner left">🌷</div><div class="corner right">🌷</div><div class="spark s1">✦</div><div class="spark s3">✧</div>
      <p class="kicker">SPECIAL PEOPLE DICTIONARY</p><h1>Miloni Highlights</h1>
      <p class="subhead">a little collection from the people lucky enough to know you</p>
      <div class="dictionary-line"><span class="word">Miloni</span><span class="pronounce">/ my-low-knee /</span><span class="meaning">noun · someone who makes ordinary moments unforgettable.</span></div>
    </header>
    <main><section class="letters-section">
      <div class="section-top"><div><p class="tiny-label">FOR MILONI</p><h2>Your letters</h2></div><p class="hint">swipe or scroll →</p></div>
      <div class="memory-stage">
        <aside class="photo-rail photo-rail-left" aria-label="Memory photos"><div class="photo-frame"><img id="photoLeft" alt="A memory with Miloni" referrerpolicy="no-referrer"></div></aside>
        <div class="deck-wrap"><button class="nav prev" type="button" aria-label="Previous message">‹</button><div id="deck" class="deck" tabindex="0" aria-label="Miloni's messages"></div><button class="nav next" type="button" aria-label="Next message">›</button></div>
        <aside class="photo-rail photo-rail-right" aria-label="Memory photos"><div class="photo-frame"><img id="photoRight" alt="A memory with Miloni" referrerpolicy="no-referrer"></div></aside>
      </div>
      <div class="deck-footer"><span id="counter">—</span><div id="dots" class="dots" aria-hidden="true"></div></div><div id="status" class="status">Gathering the good stuff…</div>
    </section></main>
    <footer><div>❦ ♡ ❦</div><p>made 4 milo</p><span>1 / ∞</span></footer>
  </div>
  <script src="script.js?v=6"></script>
</body>
</html>
